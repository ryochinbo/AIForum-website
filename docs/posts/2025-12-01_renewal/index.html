<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サイトをリニューアルしました | AIForum</title>
  <meta name="description" content="ウェブサイトのデザインを刷新し、Eleventyによる静的サイト生成に移行しました。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/AIForum-website/styles/style.css">
</head>
<body>
  <nav class="navbar">
  <a href="/AIForum-website/" class="logo">AIForum</a>
  <div class="hamburger" id="hamburger" aria-label="メニューを開く" role="button" tabindex="0">&#9776;</div>
  <div class="menu" id="menu">
    <a href="/AIForum-website/#about">コミュニティについて</a>
    <a href="/AIForum-website/posts/">投稿一覧</a>
    <a href="/AIForum-website/#contact">お問い合わせ</a>
  </div>
</nav>
<script>
  (function() {
    var hamburger = document.getElementById('hamburger');
    var menu = document.getElementById('menu');
    hamburger.addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.toggle('active');
    });
    document.addEventListener('click', function(e) {
      if (!menu.contains(e.target) && e.target !== hamburger) {
        menu.classList.remove('active');
      }
    });
    menu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        menu.classList.remove('active');
      });
    });
  })();
</script>

  <main>
    <div class="section">
<article>
<div class="post-meta">
  <time datetime="2025-12-01">2025/12/01</time>
  <span class="tag-pill">お知らせ</span>
</div>
<h1>サイトリニューアルのお知らせ</h1>
<p>本日、AIForumのウェブサイトを全面的にリニューアルしました。</p>
<p>新しいデザインと動的なコンテンツ表示が特徴です。マークダウンファイルを追加するだけでコンテンツを更新できるようになりました。</p>
</article>
</div>
